name: "mycoder GitHub Action"
description: "Run mycoder in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of MyCoder App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/mycoder'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.afs-mycoder.twcc.ai"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get mycoder version
      id: version
      shell: bash
      run: |
        VERSION="0.0.0-mr-129-202609220811"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Cache mycoder
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.mycoder/bin
        key: mycoder-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install mycoder
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm install -g @ocis/mycoder-cli@${{ steps.version.outputs.version }} --prefix "$HOME/.mycoder"

    - name: Add mycoder to PATH
      shell: bash
      run: echo "$HOME/.mycoder/bin" >> $GITHUB_PATH

    - name: Run mycoder
      shell: bash
      id: run_mycoder
      run: mycoder github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
